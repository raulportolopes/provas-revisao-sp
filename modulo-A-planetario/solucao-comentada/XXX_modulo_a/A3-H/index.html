<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A3-H · Painel do Observatório</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ===== HTML FORNECIDO AO COMPETIDOR · NÃO MODIFICAR ===== -->
  <main class="painel">
    <h1>Painel do Observatório</h1>

    <section class="cartao cartao--barras" aria-labelledby="t-barras">
      <h2 id="t-barras">Visitantes por sessão</h2>
      <ul class="barras">
        <li class="barra" style="--v: 92; --i: 0" data-valor="92%"><span>Céu de Verão</span></li>
        <li class="barra" style="--v: 74; --i: 1" data-valor="74%"><span>Planetas</span></li>
        <li class="barra" style="--v: 58; --i: 2" data-valor="58%"><span>Via Láctea</span></li>
        <li class="barra" style="--v: 81; --i: 3" data-valor="81%"><span>Lua Cheia</span></li>
        <li class="barra" style="--v: 35; --i: 4" data-valor="35%"><span>Buracos Negros</span></li>
        <li class="barra" style="--v: 66; --i: 5" data-valor="66%"><span>Constelações</span></li>
      </ul>
    </section>

    <section class="cartao cartao--rosca" aria-labelledby="t-rosca">
      <h2 id="t-rosca">Público por idade</h2>
      <div class="rosca" style="--a: 40; --b: 25; --c: 20; --d: 15" data-total="1.284 visitantes"></div>
      <ul class="legenda">
        <li class="legenda__item legenda__item--a">Crianças (40%)</li>
        <li class="legenda__item legenda__item--b">Jovens (25%)</li>
        <li class="legenda__item legenda__item--c">Adultos (20%)</li>
        <li class="legenda__item legenda__item--d">Idosos (15%)</li>
      </ul>
    </section>

    <section class="cartao cartao--medidor" aria-labelledby="t-medidor">
      <h2 id="t-medidor">Céu limpo esta noite</h2>
      <div class="medidor" style="--v: 72" data-valor="72%">
        <div class="medidor__ponteiro"></div>
      </div>
      <p class="medidor__escala"><span>0%</span><span>100%</span></p>
    </section>
  </main>
</body>
</html>
