<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A1-E · Botão Adicionar ao Carrinho</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ===== HTML FORNECIDO AO COMPETIDOR · NÃO MODIFICAR ===== -->
  <main class="vitrine">
    <article class="produto">
      <h1 class="produto__nome">Café Mantiqueira 250 g</h1>
      <p class="produto__preco">R$ 42,90</p>

      <label class="btn-add">
        <input type="checkbox" class="btn-add__check">
        <span class="btn-add__liquido" aria-hidden="true"></span>
        <span class="btn-add__icone" aria-hidden="true"></span>
        <span class="btn-add__textos">
          <span class="btn-add__texto btn-add__texto--add">Adicionar ao carrinho</span>
          <span class="btn-add__texto btn-add__texto--ok">Adicionado</span>
        </span>
      </label>
    </article>
  </main>
</body>
</html>
