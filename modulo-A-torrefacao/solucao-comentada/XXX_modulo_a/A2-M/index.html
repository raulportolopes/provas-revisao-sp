<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A2-M · Cartões 3D que seguem o cursor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ===== HTML FORNECIDO AO COMPETIDOR · NÃO MODIFICAR ===== -->
  <main class="colecao">
    <h1>Coleção Torra Paulista</h1>
    <div class="cartoes">
      <article class="cartao">
        <div class="cartao__corpo">
          <span class="zona"></span>
          <span class="zona"></span>
          <span class="zona"></span>
          <span class="zona"></span>
          <span class="zona"></span>
          <span class="zona"></span>
          <span class="zona"></span>
          <span class="zona"></span>
          <span class="zona"></span>
          <img class="cartao__pacote" src="images/mantiqueira.png" alt="Pacote do café Mantiqueira">
          <span class="cartao__selo">Torra média</span>
          <h2 class="cartao__nome">Mantiqueira</h2>
          <p class="cartao__notas">Notas de caramelo e laranja</p>
          <span class="cartao__brilho" aria-hidden="true"></span>
        </div>
      </article>
      <article class="cartao">
        <div class="cartao__corpo">
          <span class="zona"></span>
          <span class="zona"></span>
          <span class="zona"></span>
          <span class="zona"></span>
          <span class="zona"></span>
          <span class="zona"></span>
          <span class="zona"></span>
          <span class="zona"></span>
          <span class="zona"></span>
          <img class="cartao__pacote" src="images/cerrado.png" alt="Pacote do café Cerrado Mineiro">
          <span class="cartao__selo">Torra média-escura</span>
          <h2 class="cartao__nome">Cerrado Mineiro</h2>
          <p class="cartao__notas">Chocolate e castanhas</p>
          <span class="cartao__brilho" aria-hidden="true"></span>
        </div>
      </article>
      <article class="cartao">
        <div class="cartao__corpo">
          <span class="zona"></span>
          <span class="zona"></span>
          <span class="zona"></span>
          <span class="zona"></span>
          <span class="zona"></span>
          <span class="zona"></span>
          <span class="zona"></span>
          <span class="zona"></span>
          <span class="zona"></span>
          <img class="cartao__pacote" src="images/mogiana.png" alt="Pacote do café Alta Mogiana">
          <span class="cartao__selo">Torra clara</span>
          <h2 class="cartao__nome">Alta Mogiana</h2>
          <p class="cartao__notas">Mel e frutas amarelas</p>
          <span class="cartao__brilho" aria-hidden="true"></span>
        </div>
      </article>
    </div>
  </main>

</html>
