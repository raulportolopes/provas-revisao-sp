<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Pulso Academias: reserve aulas, acompanhe sua frequência e gerencie seu perfil.">
  <meta name="theme-color" content="#FF3D5A">
  <title>Pulso Academias</title>
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <!-- tema.js roda ANTES de pintar a página: evita o "piscar" do tema claro quando o aluno escolheu o escuro. -->
  <script src="js/tema.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <!-- type="module": permite usar import/export entre arquivos sem nenhuma ferramenta de build. -->
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="pular" href="#conteudo">Pular para o conteúdo</a>

  <header class="topo" id="topo" hidden>
    <div class="topo__interno">
      <a class="logo" href="#/agenda" aria-label="Pulso Academias, ir para a agenda">
        <img src="img/logo-pulso.svg" alt="" width="132" height="32">
      </a>
      <nav class="menu" aria-label="Principal">
        <a href="#/agenda" data-rota="agenda"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M7 2v3M17 2v3M3 9h18M5 5h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"/></svg><span>Agenda</span></a>
        <a href="#/reservas" data-rota="reservas"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M9 11l3 3 8-8M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg><span>Reservas</span></a>
        <a href="#/progresso" data-rota="progresso"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg><span>Progresso</span></a>
        <a href="#/perfil" data-rota="perfil"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M20 21a8 8 0 0 0-16 0M12 13a5 5 0 1 0 0-10 5 5 0 0 0 0 10z"/></svg><span>Perfil</span></a>
      </nav>
      <div class="topo__acoes">
        <button type="button" class="btn-icone" id="btn-tema" aria-label="Alternar tema claro e escuro">
          <svg class="ico-sol" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="ico-lua" aria-hidden="true" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <a class="avatar-topo" href="#/perfil" id="avatar-topo"><span class="avatar" id="avatar-topo-img"></span><span class="avatar-topo__nome" id="avatar-topo-nome"></span></a>
      </div>
    </div>
  </header>

  <main id="conteudo" tabindex="-1">
    <!-- Cada tela é desenhada aqui pelo roteador (js/rotas.js). -->
  </main>

  <footer class="rodape" id="rodape" hidden>
    <p>Pulso Academias · Projeto de treino da modalidade 17 Tecnologias Web · Dados fictícios.</p>
  </footer>

  <!-- Região onde aparecem os avisos rápidos (toasts). aria-live faz o leitor de tela anunciar. -->
  <div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>
</body>
</html>
